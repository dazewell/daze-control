name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build DazeControl.slnx -c Release -nologo
      - name: Test
        run: dotnet test --solution DazeControl.slnx -c Release --no-build
      # Publishes the engine and dctl with Native AOT (the only check that catches AOT/trim warnings, errors here,
      # D-001) and the editor, then packs them as release.yml does (D-043), so a release never meets a new failure.
      - name: Pack (Velopack)
        shell: pwsh
        run: ./scripts/pack.ps1
