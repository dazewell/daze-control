# Dev sample for scripts/dev-run.ps1 -Sample big: copied once to %LOCALAPPDATA%\CtrlAltDaze\dev\big.yaml.
# Large flows for canvas performance and motion checks (T21.8 frame probe: the 100-step flow). SAFE: steps only
# wait, show messages, check network/power/disk/files/programs/time/lock state, or set this config's own flags.
# No triggers or hotkeys. Mesh 60 and Probe 100 count every box (cards and their members too). Running Probe 100
# takes a while and shows many messages: it is for the canvas.
version: 1
flows:
  chain-40:
    name: Chain of 40
    nodes:
      - { id: s1, step: notify, with: { text: "Step 1", sound: false } }
      - { id: s2, step: network.internet, onFailure: ignore, after: [s1] }
      - { id: s3, step: power.source, onFailure: ignore, after: [s2] }
      - { id: s4, step: file.space, with: { gb: "1" }, onFailure: ignore, after: [s3] }
      - { id: s5, step: file.check, with: { path: "%WINDIR%" }, after: [s4] }
      - { id: s6, step: process.check, with: { program: explorer }, onFailure: ignore, after: [s5] }
      - { id: s7, step: time.check, onFailure: ignore, after: [s6] }
      - { id: s8, step: flag.set, with: { name: big-8 }, after: [s7] }
      - { id: s9, step: pc.locked, with: { is: unlocked }, onFailure: ignore, after: [s8] }
      - { id: s10, step: wait, with: { duration: 1s }, after: [s9] }
